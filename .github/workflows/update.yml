name: Update cup standings

on:
  schedule:
    - cron: "17 * * * *"   # hourly safety net; GitHub often skips these, so a run keeps itself going during games
  workflow_dispatch:        # lets you start it by hand from the Actions tab

concurrency:
  group: cup-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh from ESPN (every 5 minutes during game hours)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cup-bot"
          git config user.email "cup-bot@users.noreply.github.com"
          bash poll.sh
